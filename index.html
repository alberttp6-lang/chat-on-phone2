<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI 專屬伴侶">
  <title>AI 專屬伴侶</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", sans-serif;
      background-color: #8cabd9;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: 12px;
      padding-left: 14px;
      padding-right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      z-index: 10;
    }
    .char-info { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; color: #111; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: #e1e8f0; display: flex; align-items: center; justify-content: center;
      font-size: 18px; overflow: hidden; flex-shrink: 0;
    }
    .header-btns { display: flex; gap: 6px; }
    .icon-btn {
      background: #f0f2f5; border: none; padding: 6px 10px; border-radius: 14px;
      font-size: 12px; color: #333; cursor: pointer; font-weight: 500;
    }
    #status-bar {
      background: rgba(0, 0, 0, 0.65); color: #fff; font-size: 12px;
      text-align: center; padding: 6px; display: none;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 85%; }
    .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.model { align-self: flex-start; }
    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.45;
      word-wrap: break-word;
      white-space: pre-wrap;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }
    .msg-row.user .bubble { background: #06c755; color: #fff; border-bottom-right-radius: 4px; }
    .msg-row.model .bubble { background: #ffffff; color: #111; border-bottom-left-radius: 4px; }
    .input-area {
      background: #fff;
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
      align-items: center;
      border-top: 1px solid rgba(0,0,0,0.08);
    }
    #user-input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 10px 14px;
      font-size: 16px;
      outline: none;
      background: #f7f8fa;
    }
    #send-btn {
      background: #06c755; color: white; border: none;
      border-radius: 20px; padding: 10px 16px; font-size: 15px; font-weight: 600;
      cursor: pointer; flex-shrink: 0;
    }
    #send-btn:disabled { background: #a5d8b8; }
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100;
    }
    .modal-content {
      background: #fff; width: 100%; max-width: 420px; border-radius: 16px;
      padding: 20px; display: flex; flex-direction: column; gap: 12px; max-height: 85vh; overflow-y: auto;
    }
    .modal-content h3 { font-size: 17px; margin-bottom: 2px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 13px; color: #555; font-weight: 600; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px;
    }
    .field textarea { height: 110px; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
    .hint { font-size: 12px; color: #777; line-height: 1.4; }
  </style>
</head>
<body>

  <header>
    <div class="char-info">
      <div class="avatar" id="header-avatar">🐱</div>
      <span id="header-name">專屬角色</span>
    </div>
    <div class="header-btns">
      <button class="icon-btn" onclick="openMemoryModal()">🧠 記憶庫</button>
      <button class="icon-btn" onclick="clearChat()">清除對話</button>
      <button class="icon-btn" onclick="openSettings()">⚙️ 設定</button>
    </div>
  </header>

  <div id="status-bar">🌙 正在為你精簡過去 24 小時的重要記憶...</div>
  <div id="chat-box"></div>

  <div class="input-area">
    <input type="text" id="user-input" placeholder="輸入訊息..." autocomplete="off">
    <button id="send-btn" onclick="sendMessage()">傳送</button>
  </div>

  <!-- 記憶庫管理彈窗 -->
  <div id="memory-modal" class="modal">
    <div class="modal-content">
      <h3>🧠 長期記憶庫（每日 04:00 自動精簡）</h3>
      <p class="hint">系統會在每天早上 4 點後，自動將前 24 小時的對話濃縮進下方記憶庫，並遺忘瑣碎細節。你也可以直接手動修改內容：</p>
      <div class="field">
        <label>記憶容量上限（字數限制，超過將選擇性遺忘）</label>
        <input type="number" id="max-memory-chars" value="800" min="200" max="5000">
      </div>
      <div class="field">
        <label>目前已記住的重要事項（當前字數：<span id="mem-count">0</span> 字）</label>
        <textarea id="memory-text" style="height:160px;" placeholder="目前尚無長期記憶，累積對話後將於每日 04:00 自動生成..."></textarea>
      </div>
      <div class="field">
        <span class="hint" id="last-consolidated-label">上次自動整理時間：尚未執行</span>
      </div>
      <div class="modal-actions">
        <button class="icon-btn" onclick="triggerManualConsolidate()" style="background:#e8f0fe;color:#1967d2;">立即濃縮記憶</button>
        <button class="icon-btn" onclick="closeMemoryModal()">取消</button>
        <button class="icon-btn" style="background:#06c755;color:#fff;" onclick="saveMemoryModal()">儲存記憶</button>
      </div>
    </div>
  </div>

  <!-- 設定彈窗 -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <h3>⚙️ 角色與 API 設定</h3>
      <div class="field">
        <label>Gemini API Key（必填）</label>
        <input type="password" id="api-key" placeholder="貼上 AIza 開頭的金鑰">
      </div>
      <div class="field">
        <label>Gemini 模型版本</label>
        <select id="model-name">
          <option value="gemini-2.5-flash">gemini-2.5-flash（穩定推薦）</option>
          <option value="gemini-3.8-flash">gemini-3.8-flash</option>
          <option value="gemini-3.5-flash">gemini-3.5-flash</option>
          <option value="gemini-flash-latest">gemini-flash-latest（自動最新）</option>
        </select>
      </div>
      <div class="field">
        <label>角色名稱</label>
        <input type="text" id="char-name" placeholder="例如：小希">
      </div>
      <div class="field">
        <label>角色頭像（Emoji）</label>
        <input type="text" id="char-avatar" placeholder="例如：🐱">
      </div>
      <div class="field">
        <label>角色人設與背景（System Prompt）</label>
        <textarea id="sys-prompt"></textarea>
      </div>
      <div class="modal-actions">
        <button class="icon-btn" onclick="closeSettings()">取消</button>
        <button class="icon-btn" style="background:#06c755;color:#fff;" onclick="saveSettings()">儲存設定</button>
      </div>
    </div>
  </div>

  <script>
    let chatHistory = JSON.parse(localStorage.getItem('rp_history') || '[]');
    let memoryState = JSON.parse(localStorage.getItem('rp_memory_state') || JSON.stringify({
      longTermMemory: '',
      maxChars: 800,
      lastConsolidatedAt: 0
    }));
    let config = JSON.parse(localStorage.getItem('rp_config') || JSON.stringify({
      apiKey: '',
      model: 'gemini-2.5-flash',
      name: '小希',
      avatar: '🐱',
      systemPrompt: '你現在扮演我的青梅竹馬「小希」，性格溫柔帶點調皮，說話自然口語化，像在傳 LINE 一樣簡短自然，絕對不要承認自己是 AI。'
    }));

    function initApp() {
      document.getElementById('header-name').textContent = config.name;
      document.getElementById('header-avatar').textContent = config.avatar;
      renderMessages();
      if (!config.apiKey) {
        openSettings();
      } else {
        checkFourAMConsolidation();
      }
    }

    // 計算最近一次「早上 4:00」的時間戳記
    function getLatestFourAMTimestamp() {
      const now = new Date();
      const fourAM = new Date(now);
      fourAM.setHours(4, 0, 0, 0);
      if (now < fourAM) {
        fourAM.setDate(fourAM.getDate() - 1);
      }
      return fourAM.getTime();
    }

    // 檢查是否已經跨過早上 4:00 且需要整理前 24 小時的對話
    async function checkFourAMConsolidation() {
      const latestFourAM = getLatestFourAMTimestamp();
      if (memoryState.lastConsolidatedAt < latestFourAM && chatHistory.length >= 4) {
        await consolidateMemory(false);
      }
    }

    // 每分鐘定期檢查一次（若凌晨 4 點剛好開著 App 也會自動觸發）
    setInterval(() => {
      if (config.apiKey) checkFourAMConsolidation();
    }, 60000);

    // 執行記憶打包精簡與選擇性遺忘
    async function consolidateMemory(isManual = false) {
      if (!config.apiKey) return;
      const now = Date.now();
      const oneDayAgo = now - 24 * 60 * 60 * 1000;

      // 篩選過去 24 小時的對話（若是手動觸發且 24 小時內無對話，則打包現有全部對話）
      let recentMessages = chatHistory.filter(m => !m.timestamp || m.timestamp >= oneDayAgo);
      if (recentMessages.length === 0) recentMessages = chatHistory;
      if (recentMessages.length === 0) {
        if (isManual) alert('目前沒有可整理的對話紀錄！');
        return;
      }

      const statusBar = document.getElementById('status-bar');
      statusBar.style.display = 'block';

      const dialogueText = recentMessages.map(m => {
        const speaker = m.role === 'user' ? '使用者' : config.name;
        return `${speaker}：${m.parts[0].text}`;
      }).join('\n');

      const memoryPrompt = `你是一個專屬的角色記憶管理系統。請將【既有長期記憶】與【過去24小時對話紀錄】進行融合與精簡，輸出更新後的長期記憶。

【整理與遺忘規則】：
1. 字數嚴格限制在 ${memoryState.maxChars} 個中文字以內。
2. 優先保留：使用者的個人資訊、喜好、重要事件、雙方的情感進展與重要約定。
3. 選擇性遺忘：若總內容超過字數上限，請自動刪除日常瑣碎寒暄（如早安晚安、吃飽沒）、過時資訊或次要細節。
4. 請用條列式或精簡段落直接輸出整理後的記憶內容，不要包含任何開場白或解釋。

【既有長期記憶】：
${memoryState.longTermMemory || '（尚無紀錄）'}

【過去24小時對話紀錄】：
${dialogueText}`;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${config.model}:generateContent?key=${config.apiKey}`;
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ role: 'user', parts: [{ text: memoryPrompt }] }]
          })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const newMemory = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
        if (newMemory) {
          memoryState.longTermMemory = newMemory.slice(0, memoryState.maxChars);
          memoryState.lastConsolidatedAt = Date.now();
          localStorage.setItem('rp_memory_state', JSON.stringify(memoryState));

          // 記憶沉澱後，只保留最近 10 句對話維持語境，清理舊對話以節省額度
          if (chatHistory.length > 10) {
            chatHistory = chatHistory.slice(-10);
            localStorage.setItem('rp_history', JSON.stringify(chatHistory));
            renderMessages();
          }
          if (isManual) {
            document.getElementById('memory-text').value = memoryState.longTermMemory;
            updateMemCount();
            alert('✅ 記憶濃縮完成！已自動保留關鍵記憶並清理舊對話。');
          }
        }
      } catch (err) {
        if (isManual) alert('記憶整理失敗：' + err.message);
      } finally {
        statusBar.style.display = 'none';
      }
    }

    function renderMessages() {
      const box = document.getElementById('chat-box');
      box.innerHTML = '';
      chatHistory.forEach(item => {
        const row = document.createElement('div');
        row.className = `msg-row ${item.role}`;
        if (item.role === 'model') {
          const av = document.createElement('div');
          av.className = 'avatar';
          av.textContent = config.avatar;
          row.appendChild(av);
        }
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = item.parts[0].text;
        row.appendChild(bubble);
        box.appendChild(row);
      });
      box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const btn = document.getElementById('send-btn');
      const text = input.value.trim();
      if (!text) return;
      if (!config.apiKey) { alert('請先點選右上角「設定」填入 Gemini API Key！'); openSettings(); return; }

      input.value = '';
      chatHistory.push({ role: 'user', parts: [{ text }], timestamp: Date.now() });
      localStorage.setItem('rp_history', JSON.stringify(chatHistory));
      renderMessages();
      btn.disabled = true;

      // 將角色人設與長期記憶庫結合
      const combinedSystemPrompt = memoryState.longTermMemory
        ? `${config.systemPrompt}\n\n【你們過去的重要長期記憶（請自然融入對話，勿刻意背誦）】：\n${memoryState.longTermMemory}`
        : config.systemPrompt;

      // 傳送給 API 時移除自訂的 timestamp 欄位以符合官方格式
      const apiContents = chatHistory.map(m => ({ role: m.role, parts: m.parts }));

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${config.model}:generateContent?key=${config.apiKey}`;
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: combinedSystemPrompt }] },
            contents: apiContents
          })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '（角色沒有回應）';
        chatHistory.push({ role: 'model', parts: [{ text: reply }], timestamp: Date.now() });
        localStorage.setItem('rp_history', JSON.stringify(chatHistory));
        renderMessages();
      } catch (err) {
        alert('發送失敗：' + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('user-input').addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });

    function updateMemCount() {
      const len = document.getElementById('memory-text').value.length;
      document.getElementById('mem-count').textContent = len;
    }
    document.getElementById('memory-text').addEventListener('input', updateMemCount);

    function openMemoryModal() {
      document.getElementById('memory-text').value = memoryState.longTermMemory;
      document.getElementById('max-memory-chars').value = memoryState.maxChars || 800;
      const lastTime = memoryState.lastConsolidatedAt
        ? new Date(memoryState.lastConsolidatedAt).toLocaleString('zh-TW')
        : '尚未執行';
      document.getElementById('last-consolidated-label').textContent = `上次整理時間：${lastTime}`;
      updateMemCount();
      document.getElementById('memory-modal').style.display = 'flex';
    }
    function closeMemoryModal() { document.getElementById('memory-modal').style.display = 'none'; }
    function saveMemoryModal() {
      memoryState.maxChars = parseInt(document.getElementById('max-memory-chars').value, 10) || 800;
      memoryState.longTermMemory = document.getElementById('memory-text').value.trim().slice(0, memoryState.maxChars);
      localStorage.setItem('rp_memory_state', JSON.stringify(memoryState));
      closeMemoryModal();
    }
    async function triggerManualConsolidate() {
      memoryState.maxChars = parseInt(document.getElementById('max-memory-chars').value, 10) || 800;
      await consolidateMemory(true);
      const lastTime = memoryState.lastConsolidatedAt
        ? new Date(memoryState.lastConsolidatedAt).toLocaleString('zh-TW')
        : '尚未執行';
      document.getElementById('last-consolidated-label').textContent = `上次整理時間：${lastTime}`;
    }

    function openSettings() {
      document.getElementById('api-key').value = config.apiKey;
      document.getElementById('model-name').value = config.model;
      document.getElementById('char-name').value = config.name;
      document.getElementById('char-avatar').value = config.avatar;
      document.getElementById('sys-prompt').value = config.systemPrompt;
      document.getElementById('settings-modal').style.display = 'flex';
    }
    function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
    function saveSettings() {
      config.apiKey = document.getElementById('api-key').value.trim();
      config.model = document.getElementById('model-name').value;
      config.name = document.getElementById('char-name').value.trim() || '專屬角色';
      config.avatar = document.getElementById('char-avatar').value.trim() || '🐱';
      config.systemPrompt = document.getElementById('sys-prompt').value.trim();
      localStorage.setItem('rp_config', JSON.stringify(config));
      initApp();
      closeSettings();
    }
    function clearChat() {
      if (confirm('確定要清除當前對話紀錄嗎？（🧠 長期記憶庫的內容仍會保留）')) {
        chatHistory = [];
        localStorage.removeItem('rp_history');
        renderMessages();
      }
    }

    initApp();
  </script>
</body>
</html>
